<table mat-table [dataSource]="bets">

  <ng-container matColumnDef="bet">
    <th mat-header-cell *matHeaderCellDef>Aposta</th>
    <td mat-cell *matCellDef="let aposta">
      {{ aposta.bet }}
    </td>
  </ng-container>

  <ng-container matColumnDef="win">
    <th mat-header-cell *matHeaderCellDef>Ganho</th>
    <td mat-cell *matCellDef="let aposta">
      {{ aposta.win }}
    </td>
  </ng-container>

  <ng-container matColumnDef="loss">
    <th mat-header-cell *matHeaderCellDef>Perda</th>
    <td mat-cell *matCellDef="let aposta">
      {{ aposta.loss }}
    </td>
  </ng-container>

  <ng-container matColumnDef="created_at">
    <th mat-header-cell *matHeaderCellDef>Data</th>
    <td mat-cell *matCellDef="let aposta">
      {{ aposta.created_at | date:'dd/MM/yyyy HH:mm:ss' }} 
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
