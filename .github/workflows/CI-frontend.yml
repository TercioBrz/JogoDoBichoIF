name: workflow frontend-angular

on:

  push:
    branches:
      - develop
    # paths:
    #   - 'frontend/**'

  pull_request:
    branches:
      - develop
    # paths:
    #   - 'frontend/**'

defaults:
  run:
    shell: bash
    working-directory: frontend/core-frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/core-frontend/package-lock.json


      - name: Instalar dependências
        run: npm ci

      - name: Build Angular
        run: npm run build -- --configuration production

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/core-frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm run test -- --watch=false 
