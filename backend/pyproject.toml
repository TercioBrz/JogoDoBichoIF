[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.3",
    "factory-boy>=3.3.3",
    "faker>=40.8.0",
    "psycopg[binary]>=3.3.3",
    "pyjwt>=2.11.0",
    "pytest>=9.0.2",
    "pytest-django>=4.12.0",
    "python-dotenv>=1.2.2",
    "redis>=7.3.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
pythonpath = ["core"]
testpaths = ["core/tests"]
python_files = ["test_*.py"]